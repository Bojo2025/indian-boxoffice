name: Publish desk board

on:
  schedule:
    # Every 3 hours — board only. Briefs have their own IST slots below.
    - cron: "0 */3 * * *"
    # 07:00 IST — yesterday's closed day
    - cron: "30 1 * * *"
    # 13:00 IST — shows, occupancy, advance bookings
    - cron: "30 7 * * *"
    # 20:00 IST — the day's collections so far
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      brief_slot:
        description: "Desk report to write: morning, midday, evening, or all"
        required: false
        default: "all"
        type: string
      force_brief:
        description: "Rewrite today's report even if that slot already exists"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Publish consensus board
        id: publish
        continue-on-error: true
        run: npm run publish:desk
      - name: Generate desk report
        id: brief
        continue-on-error: true
        env:
          FORCE_BRIEF: ${{ (inputs.force_brief == true || inputs.force_brief == 'true') && '1' || '' }}
        run: |
          # Slot comes from the cron that was scheduled, not from the clock when the runner starts.
          SCHEDULE="${{ github.event.schedule }}"
          SLOT="${{ github.event_name == 'workflow_dispatch' && inputs.brief_slot || '' }}"
          case "$SCHEDULE" in
            "30 1 * * *") SLOT="morning" ;;
            "30 7 * * *") SLOT="midday" ;;
            "30 14 * * *") SLOT="evening" ;;
          esac
          if [ -z "$SLOT" ]; then
            echo "Board refresh only — no desk-report slot on this run."
            exit 0
          fi
          echo "Writing desk report slot: $SLOT"
          BRIEF_SLOT="$SLOT" npm run morning:brief
      - name: Refresh SEO static pages
        continue-on-error: true
        run: npm run seo:pages
      - name: Commit board if changed
        run: |
          git config user.name "ibo-desk-bot"
          git config user.email "ibo-desk-bot@users.noreply.github.com"
          git add docs/catalog.js docs/board.json docs/health.json docs/history docs/app.js docs/index.html docs/styles.css docs/sitemap.xml docs/robots.txt docs/ads.txt docs/morning-brief.json docs/feed.xml docs/movies docs/rankings docs/languages docs/about-methodology docs/privacy-policy docs/brief docs/briefs docs/.indexnow-key docs/*.txt || true
          if git diff --staged --quiet; then
            echo "No board changes"
            exit 0
          fi
          git commit -m "Refresh Pages desk from Sacnilk/Koimoi/Hungama/BOI consensus."
          git push
      - name: Open or update spine failure issue
        if: steps.publish.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Scheduled `publish:desk` reported a hard spine failure (usually Sacnilk day-wise parse = 0).';
            try {
              const health = JSON.parse(fs.readFileSync('docs/health.json', 'utf8'));
              body += `\n\n**Updated:** ${health.updatedAt}\n\n`;
              body += (health.alerts || []).map((a) => `- ${a}`).join('\n');
            } catch (e) {
              body += `\n\nCould not read docs/health.json (${e.message}).`;
            }
            const title = 'Desk publish: spine scraper hard-fail';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'desk-health',
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['desk-health'],
              });
            }
